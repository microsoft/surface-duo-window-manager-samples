# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: build-test-check

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      name:
        description: 'manual build trigger'
      home:
        description: 'location'
        required: false

jobs:
  build-test-and-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        projects: [ FoldingVideo, FoldingVideoPlusChat, FoldingVideoPlusTrivia, PhotoEditor, EBookReader, PhotoEditor, SourceEditor, TravelPlanner, TwoDo, TwoNote ]
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 11
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 11

      - name: Cache gradle packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{matrix.projects}}/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ${{matrix.projects}}/gradlew

      - name: clean
        run: |
          cd ${{matrix.projects}}
          ./gradlew clean --info

      - name: assemble debug
        run: |
          cd ${{matrix.projects}}
          ./gradlew assembleDebug --info

      - name: unit tests
        run: |
          cd ${{matrix.projects}}
          ./gradlew testDebugUnitTest --info

      - name: build instrumentation tests
        run: |
            cd ${{matrix.projects}}
            ./gradlew assembleAndroidTest

      - name: lint
        run: |
          cd ${{matrix.projects}}
          ./gradlew lintDebug --info

      - name: ktlint
        run: |
          cd ${{matrix.projects}}
          ./gradlew ktlint --info
